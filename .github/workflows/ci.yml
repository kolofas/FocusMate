name: CI

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: focusmate_test
          POSTGRES_USER: ronaldo
          POSTGRES_PASSWORD: cristiano
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ronaldo -d focusmate_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      env:
        DATABASE_URL: postgresql+asyncpg://ronaldo:cristiano@localhost:5432/focusmate_test


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependicies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q
