name: CI

permissions:
  contents: read
  packages: write

on:
  pull_request:
  push:
    branches: ["main"]

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: focusmate_test
          POSTGRES_USER: ronaldo
          POSTGRES_PASSWORD: cristiano
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ronaldo -d focusmate_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://ronaldo:cristiano@localhost:5432/focusmate_test


    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

  docker-push:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image name
        run: echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to server via SSH (pull + up + healthcheck + rollback)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -Eeuo pipefail

            cd "${{ secrets.DEPLOY_PATH }}"

            echo "==> Current compose status"
            docker compose ps || true

            PREV_IMAGE="$(docker inspect "$(docker compose ps -q app)" --format '{{.Image}}')"
            echo "==> Previous image id: ${PREV_IMAGE}"

            rollback() {
              echo "==> HEALTHCHECK FAILED. Rolling back..."
              docker tag "${PREV_IMAGE}" ghcr.io/kolofas/focusmate:main
              docker compose up -d
              docker compose ps
              echo "==> Rollback complete"
            }
            trap rollback ERR

            echo "==> Pull new image"
            docker compose pull app

            echo "==> Recreate app"
            docker compose up -d

            echo "==> Waiting for health..."
            for i in {1..30}; do
              if curl -fsS http://127.0.0.1:8000/health/ping >/dev/null; then
                echo "ping ok"
                break
              fi
              sleep 2
            done
            

            echo "==> Health ping"
            curl -fsS http://127.0.0.1:8000/health/ping >/dev/null

            echo "==> Health db"
            curl -fsS http://127.0.0.1:8000/health/db >/dev/null

            echo "==> Deploy OK"
            docker compose ps
